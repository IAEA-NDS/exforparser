[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"


[project]
name = "exforparser"
authors = [
    {name = "Shin Okumura/IAEA-NDS", email = "s.okumura@iaea.org"},
]
version = "1.1.0"
description = "EXFOR Parser"
readme = "README.md"
requires-python = ">=3.11"
keywords = ["EXFOR", "Nuclear Data"]
license = {file = "LICENSE"}
classifiers = [
    "Development Status :: 4 - Beta",
    "Operating System :: OS Independent",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}


[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"exforparser.tabulate" = ["*.dat", "*.json"]
"exforparser.pickles" = ["*.pickle"]
"exforparser.schemas" = ["*.json"]
"submodules.utilities" = ["*.txt"]

[project.urls]
Homepage = "https://github.com/shinokumura/exforparser"
Issues = "https://github.com/shinokumura/exforparser/issues"

[project.scripts]
exforparser = "exforparser.main_cli:cli"

[tool.pytest.ini_options]
testpaths = ["tests"]
