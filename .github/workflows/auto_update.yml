name: Update generated EXFOR repositories

on:
  workflow_dispatch:
    inputs:
      repository_owner:
        description: Owner of exfor_master, exfor_json, and exfortables_py
        required: true
        type: choice
        default: shinokumura
        options:
          - shinokumura
          - IAEA-NDS
      publish:
        description: Commit and push generated files to the selected repositories
        required: true
        type: boolean
        default: false
  schedule:
    - cron: "0 15 * * *"

permissions:
  contents: read

concurrency:
  group: exfor-data-update-${{ github.event_name == 'workflow_dispatch' && inputs.repository_owner || vars.EXFOR_DATA_REPOSITORY_OWNER || 'shinokumura' }}
  cancel-in-progress: false

env:
  # workflow_dispatch uses the selected owner. Scheduled runs can override the
  # safe fork default with the EXFOR_DATA_REPOSITORY_OWNER repository variable.
  DATA_REPOSITORY_OWNER: ${{ github.event_name == 'workflow_dispatch' && inputs.repository_owner || vars.EXFOR_DATA_REPOSITORY_OWNER || 'shinokumura' }}
  PUBLISH_OUTPUTS: ${{ github.event_name == 'workflow_dispatch' && inputs.publish || github.event_name == 'schedule' && vars.EXFOR_PUBLISH_OUTPUTS || 'false' }}
  EXFORPARSER_DATA_DIR: ${{ github.workspace }}/nucleardata

jobs:
  update:
    if: github.event_name == 'workflow_dispatch' || vars.EXFOR_SCHEDULE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout parser
        uses: actions/checkout@v4
        with:
          path: parser
          persist-credentials: false

      - name: Checkout exfor_master
        uses: actions/checkout@v4
        with:
          repository: ${{ env.DATA_REPOSITORY_OWNER }}/exfor_master
          path: nucleardata/EXFOR/exfor_master
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout exfor_json
        uses: actions/checkout@v4
        with:
          repository: ${{ env.DATA_REPOSITORY_OWNER }}/exfor_json
          path: nucleardata/EXFOR/exfor_json
          fetch-depth: 1
          token: ${{ secrets.DATA_REPOS_TOKEN || github.token }}
          persist-credentials: ${{ env.PUBLISH_OUTPUTS == 'true' }}

      - name: Checkout exfortables_py
        uses: actions/checkout@v4
        with:
          repository: ${{ env.DATA_REPOSITORY_OWNER }}/exfortables_py
          path: nucleardata/EXFOR/exfortables_py
          fetch-depth: 1
          token: ${{ secrets.DATA_REPOS_TOKEN || github.token }}
          persist-credentials: ${{ env.PUBLISH_OUTPUTS == 'true' }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: parser/requirements.txt

      - name: Install parser
        run: python -m pip install ./parser

      - name: Prepare clean generated output trees
        shell: bash
        run: |
          json_dir="$EXFORPARSER_DATA_DIR/EXFOR/exfor_json/json"
          tables_dir="$EXFORPARSER_DATA_DIR/EXFOR/exfortables_py"

          rm -rf -- "$json_dir"
          mkdir -p -- "$json_dir"

          find "$tables_dir" -mindepth 1 -maxdepth 1 -type d \
            ! -name .git ! -name .github -exec rm -rf -- {} +

      - name: Build SQLite database and JSON
        run: exforparser -i -t all

      - name: Build exfortables_py
        run: exforparser -o all

      - name: Validate generated data
        shell: bash
        run: |
          db="$EXFORPARSER_DATA_DIR/EXFOR/exfortables.sqlite"
          json_dir="$EXFORPARSER_DATA_DIR/EXFOR/exfor_json/json"
          tables_dir="$EXFORPARSER_DATA_DIR/EXFOR/exfortables_py"

          test -s "$db"
          test "$(python -c 'import sqlite3, sys; print(sqlite3.connect(sys.argv[1]).execute("PRAGMA integrity_check").fetchone()[0])' "$db")" = "ok"
          test -n "$(find "$json_dir" -type f -name '*.json' -print -quit)"
          test -n "$(find "$tables_dir" -type f -name '*.txt' -print -quit)"

      - name: Require a cross-repository write token
        if: env.PUBLISH_OUTPUTS == 'true'
        env:
          DATA_REPOS_TOKEN: ${{ secrets.DATA_REPOS_TOKEN }}
        run: |
          if [[ -z "$DATA_REPOS_TOKEN" ]]; then
            echo "DATA_REPOS_TOKEN is required when publish=true." >&2
            exit 1
          fi

      - name: Commit and push generated repositories
        if: env.PUBLISH_OUTPUTS == 'true'
        shell: bash
        run: |
          master_sha=$(git -C "$EXFORPARSER_DATA_DIR/EXFOR/exfor_master" rev-parse HEAD)

          publish_repo() {
            repo_path="$1"
            repo_name="$2"

            git -C "$repo_path" config user.name "github-actions[bot]"
            git -C "$repo_path" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git -C "$repo_path" add -A

            if git -C "$repo_path" diff --cached --quiet; then
              echo "No changes in $repo_name"
              return
            fi

            git -C "$repo_path" commit -m "Update from exfor_master ${master_sha:0:12}"
            git -C "$repo_path" push origin HEAD:main
          }

          publish_repo "$EXFORPARSER_DATA_DIR/EXFOR/exfor_json" exfor_json
          publish_repo "$EXFORPARSER_DATA_DIR/EXFOR/exfortables_py" exfortables_py
